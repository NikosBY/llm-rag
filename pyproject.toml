[project]
name = "llm-rag"
version = "0.1.0"
description = "German RAG assistant: retrieval, generation, evaluation, LoRA fine-tuning"
requires-python = ">=3.12"
dependencies = [
    "transformers",
    "accelerate",
    "peft",
    "datasets",
    "sentence-transformers",
    "qdrant-client",
    "llama-index",
    "ragas",
    "torch",
    "gradio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
